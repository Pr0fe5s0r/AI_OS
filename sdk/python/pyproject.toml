[project]
name = "knowledgebase"
version = "0.1.0"
description = "Python client for the Knowledge Base — store documents, search them by meaning and wording, and see why each result came back."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "http://localhost:3000"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowledgebase"]
