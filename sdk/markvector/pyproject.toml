[project]
name = "markvector"
version = "0.1.0"
description = "Python client for MarkVector — store documents, search them by meaning and wording, get grounded answers with citations, and keep the original files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vector", "search", "rag", "embeddings", "retrieval", "knowledge-base"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.14"]

[project.urls]
Homepage = "http://localhost:3000"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markvector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
