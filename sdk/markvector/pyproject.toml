[project]
name = "markvector"
version = "0.2.0"
description = "Python client for MarkVector — store documents, search them by meaning and wording, get grounded answers with citations, keep the original files, and run a streaming, tool-using agent over your own LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vector", "search", "rag", "embeddings", "retrieval", "knowledge-base", "agent"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# The agent drives an OpenAI-compatible LLM you configure.
agent = ["openai>=1.0"]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.14", "openai>=1.0"]

[project.urls]
Homepage = "http://localhost:3000"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["markvector"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
