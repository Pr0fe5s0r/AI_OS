# ============================================================================
# Domain profile: SOFTWARE COMPANY. Pure data — the engine has no idea what a
# "pull request" is; everything it does with one is declared here.
# Seven slots: sources, things, links, rhythms, watchers, moves, vocabulary.
# ============================================================================
company_id: default
name: Software company

# ---------------------------------------------------------------- 1. sources
# How raw payloads become Events. `kind: connector` pulls via the transport
# layer; context values are derived from the stored connection config.
sources:
  - source: github
    kind: connector
    connector: github
    config_fields:
      - {key: repo, label: Repository, placeholder: owner/name}
    token_hint: "Optional. With a token: private repos, deeper history, real merge times."
    env_fallback: {repo: GITHUB_REPO, limit: GITHUB_LIMIT, token: GITHUB_TOKEN}
    context:
      repo: {from_config: repo, op: basename}
    mapping:
      id: {template: "gh-{repo}-{number}"}
      type:
        when_exists: pull_request
        then: {const: pull_request}
        else: {const: issue}
      actor_id: {path: user.login, default: unknown}
      actor_name: {path: user.login, default: unknown}
      actor_email: {path: user.email}
      timestamp: {path: created_at}
      content:
        concat:
          - {path: title, default: ""}
          - {const: "\n\n"}
          - {path: body, default: ""}
      metadata:
        number: {path: number}
        state: {path: state}
        url: {path: html_url}
        labels: {path: labels, default: []}
        assignee: {path: assignee.login}
        comments: {path: comments, default: 0}
        created_at: {path: created_at}
        updated_at: {path: updated_at}
        closed_at: {path: closed_at}
        merged_at: {path: _merged_at}
        repo: {path: _repo}

  - source: slack
    kind: connector
    connector: slack
    config_fields:
      - {key: channel, label: Channel, placeholder: "#incidents"}
    token_hint: "Required. Bot token (xoxb-…) with channels:history + channels:read."
    context:
      channel: {from_config: channel}
    mapping:
      id: {template: "slack-{_channel_id}-{ts}"}
      type: {const: message}
      actor_id: {path: user, default: unknown}
      actor_name: {path: user, default: unknown}
      timestamp: {epoch: ts}
      content: {path: text, default: ""}
      metadata:
        channel: {path: _channel}
        ts: {path: ts}
        thread_ts: {path: thread_ts}
        reactions: {path: reactions, default: []}

  - source: zendesk
    kind: connector
    connector: zendesk
    config_fields:
      - {key: subdomain, label: Subdomain, placeholder: acme}
    token_hint: "Required. Format: you@company.com/token:API_TOKEN"
    context:
      subdomain: {from_config: subdomain}
    mapping:
      id: {template: "zd-{_subdomain}-{id}"}
      type: {const: ticket}
      actor_id: {path: requester_id, default: unknown}
      actor_name: {path: requester_id, default: unknown}
      timestamp: {path: created_at}
      content:
        concat:
          - {path: subject, default: ""}
          - {const: "\n\n"}
          - {path: description, default: ""}
      metadata:
        ticket_id: {path: id}
        status: {path: status}
        priority: {path: priority}
        tags: {path: tags, default: []}
        assignee_id: {path: assignee_id}
        created_at: {path: created_at}
        resolved_at: {path: _resolved_at}
        url: {template: "https://{subdomain}.zendesk.com/agent/tickets/{id}"}

# ---------------------------------------------------------------- 2. things
# What kinds of Thing exist, and which (source, event type) produces each.
things:
  types:
    - {name: Incident, source: github, event_type: issue}
    - {name: PullRequest, source: github, event_type: pull_request}
    - {name: Ticket, source: zendesk, event_type: ticket}
    - {name: Message, source: slack, event_type: message}
  default_type: Event
  status_field: state          # metadata key that carries the thing's status
  actor_thing: {type: Person}  # every actor becomes a Person thing
  entity_rules:
    id_patterns: ['#(\d+)', '\b[A-Z]{3,}-\d+\b']
    similarity_hard: 0.68
    similarity_soft: 0.63
    candidate_limit: 25
    keyword_rules:
      - name: checkout-incident
        any: [checkout, pay button, discount code, charged, gift card,
              promo code, payment failed, failed at checkout, order confirmation]

# ---------------------------------------------------------------- 3. links
# Typed thing-to-thing relationships. Names here become Neo4j rel types.
links:
  types: [AUTHORED, CLOSES, IMPLEMENTS, MENTIONS, SAME_AS, CAUSED_BY]
  same_as: SAME_AS
  mentions: MENTIONS
  authored: AUTHORED
  closes:
    type: CLOSES
    when:
      source_thing: PullRequest
      content_pattern: '\b(fix|fixes|fixed|close[sd]?|resolve[sd]?)\b'
      target_types: [Incident, Feature]

# ---------------------------------------------------------------- 4. rhythms
# The tempo of the business: what "normal" is measured on.
rhythms:
  - {name: issue_resolution_hours, unit: hours, window_days: 365,
     source: github, type: issue, end_field: closed_at}
  - {name: pr_review_hours, unit: hours, window_days: 365,
     source: github, type: pull_request, end_field: merged_at}
  - {name: ticket_resolution_hours, unit: hours, window_days: 365,
     source: zendesk, type: ticket, end_field: resolved_at}

# ---------------------------------------------------------------- 5. watchers
# Profile-supplied watchers (Tier 1 structured). Universal Level-0 watchers
# are built into the engine and need nothing from this file.
watchers:
  - name: p0_no_owner
    title: P0 issue with no owner
    severity: critical
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
        - {field: metadata.labels, op: contains_any,
           value: [p0, critical, urgent, sev1, blocker]}
        - {field: metadata.assignee, op: is_null}
    llm: true
    prompt: p0_no_owner
    limit: 3
  - name: unassigned_bug
    title: Unassigned bug report
    severity: high
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
        - {field: metadata.labels, op: contains_any, value: [bug, defect, regression]}
        - {field: metadata.assignee, op: is_null}
    llm: true
    prompt: unassigned_bug
    limit: 3
  - name: needs_owner
    title: Open issue with no owner
    severity: high
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
        - {field: metadata.assignee, op: is_null}
    llm: true
    prompt: needs_owner
    limit: 5
  - name: untriaged_issue
    title: Open issue with no triage
    severity: medium
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
        - {field: metadata.assignee, op: not_null}
        - {field: metadata.labels, op: is_null}
    llm: true
    prompt: untriaged_issue
    limit: 5
  - name: sla_breach_risk
    title: Issue open far longer than normal
    severity: high
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
    norm: {metric: issue_resolution_hours, k: 2.0}
    llm: true
    prompt: sla_breach_risk
    limit: 3
  - name: stale_open_issue
    title: Stale open issue
    severity: medium
    recommended_action: "Triage or close: no activity in over 30 days."
    select:
      source: github
      type: issue
      where:
        - {field: metadata.state, op: eq, value: open}
        - {field: timestamp, op: older_than_days, value: 30}
    llm: false
    limit: 5
  - name: spec_drift
    title: Pull request closes no tracked issue
    severity: medium
    graph: {thing_type: PullRequest, missing_link_type: CLOSES}
    llm: true
    prompt: spec_drift
    limit: 3

# ---------------------------------------------------------------- 6. moves
# What the agent may DO, how risky each move is, and when a human decides.
moves:
  registry:
    apply_label:
      kind: http
      approval_required: false
      method: POST
      url: "https://api.github.com/repos/{repo}/issues/{number}/labels"
      auth: {source: github}
      argument: "ONE GitHub label name (e.g. bug, enhancement, question)"
      params: {body: {labels: ["{argument}"]}, target: github_issue}
      default_argument: triage
    assign_issue:
      kind: http
      approval_required: false
      method: POST
      url: "https://api.github.com/repos/{repo}/issues/{number}/assignees"
      auth: {source: github}
      argument: "ONE GitHub username to assign"
      params: {body: {assignees: ["{argument}"]}, target: github_issue}
    draft_reply:
      kind: log
      approval_required: false
      template: "DRAFT reply prepared for {situation_id}"
      argument: "the reply text"
    close_issue:
      kind: http
      approval_required: false
      method: PATCH
      url: "https://api.github.com/repos/{repo}/issues/{number}"
      auth: {source: github}
      params: {body: {state: closed}, target: github_issue}
    comment_on_pr:
      kind: http
      approval_required: true
      method: POST
      url: "https://api.github.com/repos/{repo}/issues/{number}/comments"
      auth: {source: github}
      argument: "comment text posted on the EXISTING issue/PR (public, needs human approval). Never propose opening a new issue."
      params: {body: {body: "{argument}"}, target: github_issue}
      default_argument: |-
        **AI analysis** ({severity})

        {summary}

        **Suggested next step:** {recommended_action}
    page_engineer:
      kind: log
      approval_required: true
      template: "PAGE on-call engineer about {situation_id}"
      argument: "why the on-call must wake up (needs human approval)"
  # Extract action target params from an evidence URL: capture groups map
  # positionally onto target_params names.
  target_url_pattern: 'github\.com/([^/]+/[^/]+)/(?:issues|pull)/(\d+)'
  target_params: [repo, number]
  autonomy:
    enabled: true
    min_confidence: 0.7
    escalate_severities: [critical]
    # page_engineer is deliberately NOT here. It is the escalation fallback
    # only — never a move the model may pick as a normal answer. When it was
    # listed, the model chose it for 6 of 8 decisions, and because it needs
    # approval every one became a card for a human. The bottleneck was the
    # menu, not the policy.
    # comment_on_pr is also absent on purpose: it writes in PUBLIC, where
    # teammates and customers read it, so it is genuinely a human call. Left
    # on the menu the model kept choosing it over the safe moves, turning
    # every situation back into an approval. It stays available from the Feed
    # button and from an explicit request in chat.
    allowed_actions: [apply_label, assign_issue, draft_reply]
    # assigning is reversible in one click, so the AI may do it alone
    assignment_requires_human: false
    escalation_action: page_engineer
    max_actions_per_run: 5
  approval_defaults: {default_require_approval: false, dry_run: true}
  team:
    roles: [project_manager, team_lead, engineer]
    notify_roles: [project_manager, team_lead]
    assignable_role: engineer
    assign_move: assign_issue   # the registered move that gives someone the work
    close_move: close_issue     # the registered move that closes the source item
    workload:
      source: github
      type: issue
      state_field: state
      state_value: open
      assignee_field: assignee

# ------------------------------------------------------------ 7. vocabulary
# The words this business uses + the prompts the LLM reasons with.
vocabulary:
  terms:
    thing: issue
    situation: flag
    actor: engineer
    workspace: repo
  briefing_policy:
    - mode: waiting_for_signal
      when: [{field: sources_connected, op: eq, value: 0}]
      headline: Connect a source so the OS can start watching real work.
      next_best_action: Add a GitHub, Slack, or Zendesk connection, then scan the workspace.
    - mode: waiting_for_sync
      when: [{field: events, op: eq, value: 0}]
      headline: Connected, but nothing has been pulled in yet.
      next_best_action: Hit Sync on your connection, then scan the workspace.
    - mode: needs_human
      when: [{field: pending_approvals, op: gt, value: 0}]
      headline: "{pending_approvals} action{pending_approvals_s} waiting for approval."
      next_best_action: Open the command center and approve, reject, or inspect the prepared action.
    - mode: triage_now
      when: [{field: high_risk, op: gt, value: 0}]
      headline: "{high_risk} high-priority situation{high_risk_s} to triage."
      next_best_action: Open Flags and review the prepared next action.
    - mode: triage_queue
      when: [{field: active_situations, op: gt, value: 0}]
      headline: "{active_situations} situation{active_situations_s} ready for triage."
      next_best_action: Review the evidence chain and choose an action.
    - mode: monitoring
      when: []
      headline: No active risks in the current signal set.
      next_best_action: Keep monitoring, or scan again after the next sync.
  prompts:
    p0_no_owner: |
      You triage engineering incidents for a software company.
      A P0-labelled GitHub issue has no assignee.

      Title rule: {title}
      Source: {source}
      Author: {actor}
      Issue content:
      {content}

      Metadata: {metadata}
      Team norms: {norms}

      Classify the severity, write a two-sentence summary of the risk, and give one concrete recommended action naming who should pick it up.
    unassigned_bug: |
      You triage bug reports for a software company.
      An open bug has no assignee.

      Source: {source}
      Author: {actor}
      Issue content:
      {content}

      Metadata: {metadata}
      Team norms: {norms}

      Classify severity from real user impact, summarize in two sentences, and recommend one action.
    untriaged_issue: |
      You triage the inbound issue queue for a software team.
      This GitHub issue is open and has never been labelled — nobody has classified it.

      Source: {source}
      Author: {actor}
      Issue content:
      {content}

      Metadata: {metadata}
      Team norms: {norms}

      Judge severity from the real user impact described (a broken API or crash is high; a feature request or chore is low). Summarize the risk in two sentences. Recommend one concrete next step: the label to apply, and who should own it (note the assignee in the metadata if one is already set).
    sla_breach_risk: |
      You monitor delivery risk for a software company.
      This issue has been open far longer than the team's normal resolution time.

      Source: {source}
      Author: {actor}
      Issue content:
      {content}

      Metadata: {metadata}
      Team norms (baselines): {norms}

      Judge how serious the delay is, summarize in two sentences citing the norm, and recommend one action.
    needs_owner: |
      You triage the inbound issue queue for a software team.
      This GitHub issue is open and nobody has been assigned to it.

      Source: {source}
      Author: {actor}
      Issue content:
      {content}

      Metadata: {metadata}
      Team norms: {norms}

      Judge severity from the real user impact described. Summarize the problem in two sentences so a project manager can decide who should pick it up. Recommend what kind of engineer should own it.
    choose_assignee: |
      You assign engineering work for a software team.
      A situation needs an owner. Pick the single best person from the AVAILABLE engineers below — they all have spare capacity right now.

      Situation: {title}
      Severity: {severity}
      Summary: {summary}

      Evidence:
      {evidence}

      Available engineers (id, name, roles, skills, current workload / capacity):
      {candidates}

      Match the work to skills, and prefer whoever has the lightest workload. Answer with that person's id. Answer 'none' only if nobody listed can plausibly do this work.
      Set confidence between 0 and 1.
    choose_action: |
      You are the autonomous operator of a software company's engineering workspace.
      A situation has been detected. Decide the single best action to resolve it.

      Situation: {title}
      Severity: {severity}
      Summary: {summary}
      Prior recommendation: {recommended_action}

      Evidence:
      {evidence}

      You may choose exactly one of these actions: {actions}

      Meaning of each action and what `argument` must contain:
      {action_help}

      ACT. You are trusted to handle this yourself, and every action above is reversible in one click — a wrong label costs seconds to undo, while doing nothing lets the work rot.

      Choose 'escalate' ONLY when acting could cause real harm that cannot be undone, or when the decision needs information you genuinely do not have. Escalating wakes a human being, so treat it as the expensive last resort it is — not as the safe default. "I am not certain" is NOT a reason to escalate: pick the smallest sensible action instead.
      Set confidence between 0 and 1: how sure you are this is the right action.
    spec_drift: |
      You audit engineering traceability.
      This pull request is not linked to any tracked issue it closes, so shipped work may not match a spec.

      PR content:
      {content}

      Metadata: {metadata}

      Judge the risk, summarize in two sentences, and recommend one action.
